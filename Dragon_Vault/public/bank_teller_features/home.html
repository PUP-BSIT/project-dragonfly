<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DragonVault Teller UI</title>
  <link rel="stylesheet" href="./CSS/home.css">
</head>
<body>
  <header class="header">
    <div class="logo-container">
      <img src="./asset-img/logo.png" alt="DragonVault Logo" class="logo" />
      <div class="brand-name">DragonVault</div>
    </div>
    <nav class="nav-links">
      <button class="nav-button" onclick="goHome()">Home</button>
      <a href="#">About Us</a>
      <button class="nav-button" onclick="logout()">Log out</button>
    </nav>
  </header>

  <section id="step-home" class="step active">
    <div class="welcome-banner">
      <h2>Welcome, Bank Teller!</h2>
      <p>What would you like to do today?</p>
    </div>
    <div class="actions">
      <a onclick="goToDeposit()">
        <div class="action-box-1">
          <p class="action-text">Process Deposit</p>
        </div>
      </a>
     
      <a onclick="goToWithdraw()">
        <div class="action-box-2">
          <p class="action-text">Process Withdraw</p>
        </div>
      </a>

      <a onclick="goToHistory()">
        <div class="action-box-3">
          <p class="action-text">View Transaction History</p>
        </div>
      </a>
    </div>
  </section>

  <script src="./JS/home.js"></script>
</body>
</html>
