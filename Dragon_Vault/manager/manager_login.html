<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/login.css">
        <link rel="icon" href="../assets/logo.png">
        <title>Manager Login - DragonVault</title>
    </head>
    <body>
        <div class="header">
            <div class="logo">
                <img src="../assets/logo.png" alt="DragonVault" class="logo-img" />
                <h1 class="logo-text">DragonVault Manager</h1>
            </div>
            <nav class="nav-links">
                <a href="../../index.html">Home</a>
            </nav>
        </div>
        <div class="container">
            <div class="login-box">
                <h1 class="login-title">Manager Login</h1>
                <p class="welcome-text">Sign in to the control panel</p>
                <form id="login_form">
                    <div class="form-group">
                        <input type="text" id="login_username" class="input-field" placeholder="Username:" required />
                    </div>
                    <div class="form-group">
                        <input type="password" id="login_password" class="input-field" placeholder="Password:" required />
                    </div>
                    <button type="submit" class="signin-btn">SIGN IN</button>
                    <div id="login_error" style="color:#ffb3b3;text-align:center;margin-top:10px;display:none;"></div>
                </form>
            </div>
        </div>
        <script src="./js/login.js"></script>
    </body>
</html>
