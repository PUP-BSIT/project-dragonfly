<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposit Receipt</title>
  <link rel="stylesheet" href="../css/teller_deposit_receipt.css">
  <link rel="icon" href="/Dragon_Vault/assets/logo.png" />
</head>

<header class="header">
    <div class="logo-container">
      <img src="/Dragon_Vault/assets/logo.png" alt="DragonVault Logo" 
        class="logo" />
      <div class="brand-name">DragonVault</div>
    </div>
  </header>

<body>
  <div class="receipt-container">
    <h2>TRANSACTION RECEIPT</h2>
    <p><strong>Date:</strong> <span id="date"></span></p>
    <p><strong>Time:</strong> <span id="time"></span></p>
    <p><strong>Transaction Type:</strong> DEPOSIT</p>
    <p><strong>Account Number:</strong> <span id="account_number"></span></p>
    <p><strong>Customer:</strong> <span id="customer_name"></span></p>
    <p><strong>Amount:</strong> <span id="deposit_amount"></span></p>
    <p><strong>Previous Balance:</strong> <span id="previous_balance"></span></p>
    <p><strong>New Balance:</strong> <span id="new_balance"></span></p>
    <p><strong>Transaction ID:</strong> <span id="transaction_id"></span></p>
    <p><strong>Teller ID:</strong> <span id="teller_id"></span></p>

    <div class="button-container">
      <button id="print_btn">Print Receipt</button>
      <button id="next_btn">Next</button>
    </div>
  </div>

  <script src="../js/teller_deposit_receipt.js"></script>
</body>
</html>
