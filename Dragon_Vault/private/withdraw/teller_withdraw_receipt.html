<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdrawal Receipt</title>
  <link rel="stylesheet" href="../css/teller_withdraw_receipt.css">
  <link rel="icon" href="/Dragon_Vault/assets/logo.png" />
</head>

<header class="header">
    <div class="logo-container">
      <img src="/Dragon_Vault/assets/logo.png" alt="DragonVault Logo" 
        class="logo" />
      <div class="brand-name">DragonVault</div>
    </div>
  </header>
  
<body>
  <div class="receipt-container">
    <h2>TRANSACTION RECEIPT</h2>
    <p><strong>Date:</strong> <span id="date"></span></p>
    <p><strong>Time:</strong> <span id="time"></span></p>
    <p><strong>Transaction Type:</strong> WITHDRAWAL</p>
    <p><strong>Account Number:</strong> <span id="account_number"></span></p>
    <p><strong>Customer:</strong> <span id="customer_name"></span></p>
    <p><strong>Amount:</strong> <span id="withdraw_amount"></span></p>
    <p><strong>Previous Balance:</strong> <span id="previous_balance"></span></p>
    <p><strong>New Balance:</strong> <span id="new_balance"></span></p>
    <p><strong>Transaction ID:</strong> <span id="transaction_id"></span></p>
    <p><strong>Teller ID:</strong> <span id="teller_id"></span></p>

    <div class="button-container">
      <button id="print_btn">Print Receipt</button>
      <button id="dashboard_btn">Return to Dashboard</button>
    </div>
    <div class="transaction-prompt" style="margin-top:20px;">
      <strong>Would you like to make another transaction with the same details, or switch to deposit?</strong>
    </div>
    <div class="button-container">
      <button id="new_transaction_btn">Repeat Withdraw</button>
      <button id="switch_to_deposit_btn">Switch to Deposit</button>
    </div>
 </div>

  <script src="../js/teller_withdraw_receipt.js"></script>
</body>
</html>
