<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teller Login - Dragon Vault</title>
  <link rel="stylesheet" href="css/teller_login.css">
</head>

<header class="header">
  <div class="logo-container">
    <img src="../assets/logo.png" alt="DragonVault Logo" class="logo" />
    <div class="brand-name">DragonVault</div>
  </div>
</header>

<body>
  <div class="login-container">
    <h2>Bank Teller Login</h2>
    <form id="teller_login_form">
      <label for="username_input">Username:</label>
      <input type="text" id="username_input" name="username" required>

      <label for="password_input">Password:</label>
      <input type="password" id="password_input" name="password" required>

      <button type="submit">Login</button>
      <p id="error_message" style="color:red;"></p>
    </form>
  </div>
  <script src="js/teller_login.js"></script>
</body>
</html>
