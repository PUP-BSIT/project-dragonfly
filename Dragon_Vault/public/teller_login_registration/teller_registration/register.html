<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Teller Registration</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="container">
        <h1>Create Teller Account</h1>
        <p class="welcome-text">Welcome to DragonVault!</p>

        <form class="registration-form" id="registration_form">
            <div class="form-group">
                <label for="first_name">First Name:</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>

            <div class="form-group">
                <label for="last_name">Last Name:</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>

            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Create your password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" 
                       name="confirm_password" required>
            </div>

            <button type="button" class="register-button" 
                    id="register_button">REGISTER</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="../teller_login/login.html">Login</a>
        </p>
    </div>

    <script src="register.js"></script>
</body>

</html>
