<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Bank Teller - Dragon Vault</title>
  <link rel="stylesheet" href="css/teller_registration.css">
</head>
<body>
  <header class="header">
    <div class="logo-container">
      <img src="../assets/logo.png" alt="DragonVault Logo" class="logo" />
      <div class="brand-name">DragonVault</div>
    </div>
  </header>

  <main class="main-content">
    <div class="registration-container">
      <h2>Register Bank Teller</h2>
      <form id="teller_register_form">
        <div class="form-group">
          <label for="first_name">First Name:</label>
          <input type="text" id="first_name" name="first_name" required>
        </div>
        
        <div class="form-group">
          <label for="last_name">Last Name:</label>
          <input type="text" id="last_name" name="last_name" required>
        </div>
        
        <div class="form-group">
          <label for="branch">Branch:</label>
          <input type="text" id="branch" name="branch" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit">Register</button>
        
        <div class="message-container">
          <p id="error_message" class="error-message"></p>
          <p id="success_message" class="success-message"></p>
        </div>
        
        <p class="form-note">
          Already have an account? 
          <a href="teller_login.html">Login here</a>
        </p>
      </form>
    </div>
  </main>
  
  <script src="js/teller_registration.js"></script>
</body>
</html>
