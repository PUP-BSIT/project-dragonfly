<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Transaction History - DragonVault</title>
        <link rel="stylesheet" href="./css/dashboard.css" />
        <link rel="stylesheet" href="./css/transaction_page.css" />
        <link rel="icon" href="../assets/logo.png" />
        <script src="./js/transaction_history.js" defer></script>
    </head>
    <body>
        <header class="header">
            <div class="logo">
                <img
                    src="../assets/logo.png"
                    alt="DragonVault"
                    class="logo-img" />
                <h1 class="logo-text">DragonVault</h1>
            </div>
            <!-- Desktop Navigation -->
            <nav class="nav-buttons">
                <button class="nav-btn" onclick="goToHome()">Home</button>
                <button class="nav-btn" onclick="goToProfile()">Profile</button>
                <button class="nav-btn" onclick="logout()">Log out</button>
            </nav>
            <!-- Mobile Hamburger Menu -->
            <div class="hamburger-menu" onclick="toggleMobileMenu()">
                <div class="hamburger-line"></div>
                <div class="hamburger-line"></div>
                <div class="hamburger-line"></div>
            </div>
        </header>
        <!-- Mobile Navigation Overlay -->
        <div class="mobile-nav" id="mobileNav">
            <button class="close-btn" onclick="toggleMobileMenu()">
                &times;
            </button>
            <button
                class="mobile-nav-btn"
                onclick="goToHome(); toggleMobileMenu()">
                Home
            </button>
            <button
                class="mobile-nav-btn"
                onclick="goToProfile(); toggleMobileMenu()">
                Profile
            </button>
            <button
                class="mobile-nav-btn"
                onclick="logout(); toggleMobileMenu()">
                Log out
            </button>
        </div>

        <main class="main-content">
            <div class="transactions-container">
                <h1>Transaction History</h1>

                <div class="search-container">
                    <input
                        type="text"
                        id="transaction-search"
                        placeholder="Search transactions..." />
                </div>

                <div class="transaction-tabs">
                    <button class="tab-btn active" data-tab="outbound">
                        Outbound Transactions
                    </button>
                    <button class="tab-btn" data-tab="inbound">
                        Inbound Transactions
                    </button>
                    <button class="tab-btn" data-tab="teller">
                        Teller Transactions
                    </button>
                </div>

                <div class="tab-content active" id="outbound-tab">
                    <div class="sort-controls">
                        <button
                            class="sort-btn active"
                            data-sort-order="DESC"
                            data-type="outbound">
                            Most Recent First
                        </button>
                        <button
                            class="sort-btn"
                            data-sort-order="ASC"
                            data-type="outbound">
                            Oldest First
                        </button>
                    </div>
                    <table class="transaction-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Type</th>
                                <th>Account Number</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Recipient Account</th>
                                <th>Recipient Bank</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="user-outbound-transaction-body">
                            <!-- User outbound transactions will be populated here -->
                        </tbody>
                    </table>
                    <div class="load-more-container">
                        <button class="load-more-btn" id="load-more-outbound">
                            Load More
                        </button>
                    </div>
                </div>

                <div class="tab-content" id="inbound-tab">
                    <div class="sort-controls">
                        <button
                            class="sort-btn active"
                            data-sort-order="DESC"
                            data-type="inbound">
                            Most Recent First
                        </button>
                        <button
                            class="sort-btn"
                            data-sort-order="ASC"
                            data-type="inbound">
                            Oldest First
                        </button>
                    </div>
                    <table class="transaction-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Type</th>
                                <th>Account Number</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Sender Account</th>
                                <th>Sender Bank</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="user-inbound-transaction-body">
                            <!-- User inbound transactions will be populated here -->
                        </tbody>
                    </table>
                    <div class="load-more-container">
                        <button class="load-more-btn" id="load-more-inbound">
                            Load More
                        </button>
                    </div>
                </div>

                <div class="tab-content" id="teller-tab">
                    <div class="sort-controls">
                        <button
                            class="sort-btn active"
                            data-sort-order="DESC"
                            data-type="teller">
                            Most Recent First
                        </button>
                        <button
                            class="sort-btn"
                            data-sort-order="ASC"
                            data-type="teller">
                            Oldest First
                        </button>
                    </div>
                    <table class="transaction-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Teller</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="teller-transaction-body">
                            <!-- Teller transactions will be populated here -->
                        </tbody>
                    </table>
                    <div class="load-more-container">
                        <button class="load-more-btn" id="load-more-teller">
                            Load More
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
