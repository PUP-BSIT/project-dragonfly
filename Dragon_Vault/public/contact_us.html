<!DOCTYPE html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/contact_us.css">
        <link rel="icon" href="assets/logo.png">
        <title>DragonVault - Sign In</title>
    </head>
    <body>
        <div class="header">
            <div class="logo">
                <img
                    src="./assets/logo.png"
                    alt="DragonVault"
                    class="logo-img" />
                <h1 class="logo-text">DragonVault</h1>
            </div>
            <nav class="nav-links">
                <a href="landing_page.html">Home</a>
                <a href="#">About Us</a>
            </nav>
        </div>
        <div class="container">
            <div class="contact-box">
                <h1 class="contact-title">Contact Us</h1>
                <form id="contact_form">
                    <div class="form-group">
                        <input type="name" 
                            id="contact_username" 
                            class="input-field" 
                            placeholder="Your Name:" 
                            required />
                    </div>
                    <div class="form-group">
                        <input type="email" 
                            id="contact_password" 
                            class="input-field" 
                            placeholder="Your Email:" 
                            required />
                    </div>
                    <div class="form-group">
                        <textarea 
                            id="contact_message" 
                            class="input-field" 
                            placeholder="Your Message:" 
                            rows="4" 
                            required></textarea>
                    </div>
                    <button type="submit" class="signin-btn">Submit</button>
                    </div>
                </form>
            </div>
        </div>
        <script src="#"></script>
    </body>
</html>
