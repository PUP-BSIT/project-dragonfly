<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/dashboard.css" />
        <link rel="stylesheet" href="css/contact_us_dashboard.css" />
        <link rel="icon" href="../assets/logo.png" />
        <title>Contact Us - DragonVault</title>
    </head>
    <body>
        <header class="header">
            <div class="logo">
                <img src="../assets/logo.png" alt="DragonVault" class="logo-img" />
                <h1 class="logo-text">DragonVault</h1>
            </div>
            <nav class="nav-buttons">
                <button class="nav-btn" onclick="goToHome()">Home</button>
                <button class="nav-btn" onclick="goToProfile()">Profile</button>
                <button class="nav-btn active" onclick="goToContactUs()">Contact Us</button>
                <button class="nav-btn" onclick="logout()">Log out</button>
            </nav>
            <div class="hamburger-menu" onclick="toggleMobileMenu()">
                <div class="hamburger-line"></div>
                <div class="hamburger-line"></div>
                <div class="hamburger-line"></div>
            </div>
        </header>
        <div class="mobile-nav" id="mobileNav">
            <button class="close-btn" onclick="toggleMobileMenu()">&times;</button>
            <button class="mobile-nav-btn" onclick="goToHome(); toggleMobileMenu()">Home</button>
            <button class="mobile-nav-btn" onclick="goToProfile(); toggleMobileMenu()">Profile</button>
            <button class="mobile-nav-btn active" onclick="goToContactUs(); toggleMobileMenu()">Contact Us</button>
            <button class="mobile-nav-btn" onclick="logout(); toggleMobileMenu()">Log out</button>
        </div>
        <div class="container">
            <div class="contact-info">
                <h2>Get In Touch</h2>

                <div class="info-item">
                    <div class="info-icon">
                        <img
                            src="../assets/placeholder.png"
                            alt="location icon"
                            class="feature-icon" />
                    </div>
                    <div class="info-content">
                        <h3>Address</h3>
                        <p>
                            F3Q2+GF3, General Santos Ave, Taguig City, Metro
                            Manila
                        </p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <img
                            src="../assets/telephone.png"
                            alt="location icon"
                            class="feature-icon" />
                    </div>
                    <div class="info-content">
                        <h3>Phone</h3>
                        <p>09123456789</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <img
                            src="../assets/message.png"
                            alt="location icon"
                            class="feature-icon" />
                    </div>
                    <div class="info-content">
                        <h3>Email</h3>
                        <p>dragonvault2025@gmail.com</p>
                    </div>
                </div>
            </div>

            <div class="contact-box">
                <h1 class="contact-title">Contact Us</h1>
                <form
                    action="https://api.web3forms.com/submit"
                    method="POST"
                    id="contact_form">
                    <input
                        type="hidden"
                        name="access_key"
                        value="d12f2289-4183-49d8-acc4-fa1eac419241" />
                    <div class="form-group">
                        <input
                            type="text"
                            id="contact_username"
                            name="name"
                            class="input-field"
                            placeholder="Your Name:"
                            required />
                    </div>
                    <div class="form-group">
                        <input
                            type="email"
                            id="contact_email"
                            name="email"
                            class="input-field"
                            placeholder="Your Email:"
                            required />
                    </div>
                    <div class="form-group">
                        <textarea
                            id="contact_message"
                            name="message"
                            class="input-field"
                            placeholder="Your Message:"
                            rows="4"
                            required></textarea>
                    </div>
                    <button type="submit" class="signin-btn">Submit</button>
                </form>
            </div>
        </div>
        <script src="./js/contact_us_dashboard.js"></script>
    </body>
</html>
