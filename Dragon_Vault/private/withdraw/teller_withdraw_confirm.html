<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Confirm Withdrawal</title>
   <link rel="stylesheet" href="../css/teller_withdraw_confirm.css">
</head>

<header class="header">
    <div class="logo-container">
      <img src="/Dragon_Vault/assets/logo.png" alt="DragonVault Logo" 
        class="logo" />
      <div class="brand-name">DragonVault</div>
    </div>
  </header>
  
<body>
  <div class="confirm-container">
    <h2>Confirm Withdrawal</h2>
    <p><strong>Account Number:</strong> <span id="acc_num"></span></p>
    <p><strong>Customer Name:</strong> <span id="cust_name"></span></p>
    <p><strong>Account Type:</strong> <span id="acc_type"></span></p>
    <p><strong>Current Balance:</strong> ₱<span id="bal"></span></p>
    <p><strong>Withdraw Amount:</strong> ₱<span id="withdraw_amt"></span></p>

    <div class="button-container">
      <button id="confirm_btn">Confirm</button>
      <button id="cancel_btn">Cancel</button>
 </div>
</div>
  <script src="../js/teller_withdraw_confirm.js"></script>
</body>
</html>
