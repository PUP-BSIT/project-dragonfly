<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DragonVault Teller UI</title>
  <link rel="stylesheet" href="./CSS/confirm.css">
</head>
<body>
  <header class="header">
    <div class="logo-container">
      <img src="./asset-img/logo.png" alt="DragonVault Logo" class="logo" />
      <div class="brand-name">DragonVault</div>
    </div>
    <nav class="nav-links">
      <button class="nav-button" onclick="goHome()">Home</button>
      <a href="#">About Us</a>
      <button class="nav-button" onclick="logout()">Log out</button>
    </nav>
  </header>

  <!-- Confirm -->
  <section id="step-confirm" class="step active">
    <div class="card">
      <h2>Confirm Transaction</h2>
      <p><strong>Type:</strong> <span id="confirm-type"></span></p>
      <p><strong>Account:</strong> <span id="confirm-account"></span></p>
      <p><strong>Name:</strong> <span id="confirm-name"></span></p>
      <p><strong>Amount:</strong> ₱<span id="confirm-amount"></span></p>
      <button onclick="processTransaction()">Confirm</button>
      <button onclick="goBack()">Cancel</button>
    </div>
  </section>

  <script src="./JS/confirm.js"></script>
</body>
</html>
