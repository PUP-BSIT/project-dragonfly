<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw - Dragon Vault</title>
  <link rel="stylesheet" href="../css/teller_withdraw.css">
  <link rel="icon" href="/Dragon_Vault/assets/logo.png" />
</head>

<header class="header">
    <div class="logo-container">
      <img src="/Dragon_Vault/assets/logo.png" alt="DragonVault Logo" 
        class="logo" />
      <div class="brand-name">DragonVault</div>
    </div>
  </header>

<body>
  <h2>Withdraw Transaction</h2>

  <form id="lookupForm">
    <label>Enter Account Number:</label>
    <input type="number" id="account_number" required>
    <button type="submit">Search</button>
    <button type="button" class="back-btn" id="back_btn">Back</button>
  </form>

  <div id="account_details" style="display: none;">
    <p><strong>Name:</strong> <span id="customer_name"></span></p>
    <p><strong>Account Type:</strong> <span id="account_type"></span></p>
    <p><strong>Balance:</strong> ₱<span id="account_balance"></span></p>

    <form id="withdrawForm">
      <label>Withdraw Amount:</label>
      <span style="display:block;margin-bottom:4px;font-size:13px;color:#888;">Maximum per transaction: ₱<span id="withdrawal_limit_display">250,000.00</span></span>
      <input type="number" id="withdraw_amount" min="1" required>
      <button type="submit">Proceed</button>
    </form>
  </div>

  <div id="error_message" style="color:red;"></div>

  <script src="../js/teller_withdraw.js"></script>
</body>
</html>
