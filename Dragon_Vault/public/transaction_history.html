<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction History</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/transaction_page.css">
    <script src="js/transaction_history.js" defer></script>
</head>
<body>
    <div class="transactions-container">
        <h1>Transaction History</h1>

        <section>
            <h2>User Transactions (Outbound)</h2>
            <table class="transaction-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Account Number</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Recipient Account</th>
                        <th>Recipient Bank</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="user-outbound-transaction-body">
                    <!-- User outbound transactions will be populated here -->
                </tbody>
            </table>
        </section>

        <section>
            <h2>User Transactions (Inbound)</h2>
            <table class="transaction-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Account Number</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Sender Account</th>
                        <th>Sender Bank</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="user-inbound-transaction-body">
                    <!-- User inbound transactions will be populated here -->
                </tbody>
            </table>
        </section>

        <section>
            <h2>Teller Transactions</h2>
            <table class="transaction-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Teller</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="teller-transaction-body">
                    <!-- Teller transactions will be populated here -->
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
