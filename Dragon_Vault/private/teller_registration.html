<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Bank Teller - Dragon Vault</title>
  <link rel="stylesheet" href="css/teller_registration.css">
</head>
<body>
  <div class="registration-container">
    <h2>Register Bank Teller</h2>
    <form id="teller_register_form">
      <label for="first_name">First Name:</label>
      <input type="text" id="first_name" name="first_name" required>

      <label for="last_name">Last Name:</label>
      <input type="text" id="last_name" name="last_name" required>

      <label for="branch">Branch:</label>
      <input type="text" id="branch" name="branch" required>
      
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Register</button>
      <p id="error_message" style="color:red;"></p>
      <p id="success_message" style="color:green;"></p>
    </form>
  </div>
  <script src="js/teller_registration.js"></script>
</body>
</html>
