<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deposit - Dragon Vault</title>
  <link rel="stylesheet" href="../css/teller_dashboard.css">
</head>
<body>
  <h2>Deposit Transaction</h2>

  <form id="lookupForm">
    <label>Enter Account Number:</label>
    <input type="number" id="account_number" required>
    <button type="submit">Search</button>
  </form>

  <div id="account_details" style="display: none;">
    <p><strong>Name:</strong> <span id="customer_name"></span></p>
    <p><strong>Account Type:</strong> <span id="account_type"></span></p>
    <p><strong>Balance:</strong> ₱<span id="account_balance"></span></p>

    <form id="depositForm">
      <label>Deposit Amount:</label>
      <input type="number" id="deposit_amount" min="1" required>
      <button type="submit">Proceed</button>
    </form>
  </div>

  <div id="error_message" style="color:red;"></div>

  <script src="../js/teller_deposit.js"></script>
</body>
</html>
