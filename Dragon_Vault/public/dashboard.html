<!DOCTYPE html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/dashboard.css" />
        <link rel="icon" href="./assets/logo.png" />
        <title>DragonVault</title>
    </head>
    <body>
        <header class="header">
            <div class="logo">
                <img
                    src="./assets/logo.png"
                    alt="DragonVault"
                    class="logo-img" />
                <h1 class="logo-text">DragonVault</h1>
            </div>
            <nav class="nav-buttons">
                <button class="nav-btn active">Home</button>
                <button class="nav-btn">About Us</button>
                <button class="nav-btn">Log out</button>
            </nav>
        </header>
        <main class="main-content">
            <section class="welcome-section">
                <h1 class="welcome-title">Welcome, John Doe!</h1>
            </section>
            <div class="dashboard-grid">
                <div class="balance-card">
                    <h2 class="balance-title">Account Balance</h2>
                    <div class="balance-amount">₱ 0.00</div>
                </div>
                <div class="transfer-card">
                    <h2 class="transfer-title">Transfer Funds</h2>
                    <button id="transferBtn" 
                        class="select-btn" 
                        onclick="goToTransfer()">
                        Start Transfer
                    </button>
                </div>
            </div>
            <section class="transactions-section">
                <h2 class="transactions-header">Recent Transactions</h2>
                <div class="transactions-content">
                    No recent transactions to display
                </div>
            </section>
        </main>
        <footer class="footer">
            <div class="footer-content">
                &copy; 2025 DragonVault! All rights reserved.
                <div class="footer-links">
                    <a href="#">Terms and Conditions</a>
                    <a href="#">About</a>
                </div>
            </div>
        </footer>
        <script src="./js/dashboard.js"></script>
        <script>
            function goToTransfer() {
                window.location.href = "transfer-fund.html";
            }
        </script>
    </body>
</html>
