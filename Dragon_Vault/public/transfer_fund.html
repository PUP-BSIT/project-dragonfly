<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/transfer_fund.css" />
        <link rel="icon" href="../assets/logo.png" />
        <title>DragonVault - Digital Banking</title>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <div class="logo">
                    <img
                        src="../assets/logo.png"
                        alt="Dragon Vault Logo"
                        class="logo-image" />
                </div>
                <div class="brand-name">DragonVault</div>
            </div>
            <div class="main-content">
                <!-- Screen 1: Select Type -->
                <div class="screen active" id="screen1">
                    <div class="card">
                        <h1 class="card-title">Select Type</h1>
                        <h2 class="section-title">Select Transfer Type</h2>
                        <div class="radio-group">
                            <div
                                class="radio-option selected"
                                onclick="selectTransferType(this, 'dragonvault')">
                                <div class="radio-circle selected"></div>
                                <div class="radio-text">
                                    <div class="radio-title">
                                        Transfer to DragonVault Account
                                    </div>
                                    <div class="radio-desc">
                                        Send money to another DragonVault
                                        account
                                    </div>
                                </div>
                            </div>
                            <div
                                class="radio-option"
                                onclick="selectTransferType(this, 'bank')">
                                <div class="radio-circle"></div>
                                <div class="radio-text">
                                    <div class="radio-title">
                                        Transfer to other Bank
                                    </div>
                                    <div class="radio-desc">
                                        Send money to accounts at other banks
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="button-group">
                            <button
                                class="btn btn-primary"
                                onclick="continueTransfer()">
                                CONTINUE
                            </button>
                            <button
                                class="btn btn-secondary"
                                onclick="cancelTransaction()">
                                CANCEL
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Load JavaScript modules -->
        <script src="./js/transfer/navigation.js"></script>
        <script src="./js/transfer/validation.js"></script>
        <script src="./js/transfer/ui-handlers.js"></script>
        <script src="./js/transfer/api-service.js"></script>
        <script src="./js/transfer/main.js"></script>
    </body>
</html>
