<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Deposit</title>
  <link rel="stylesheet" href="../css/teller_deposit_confirm.css">
  <link rel="icon" href="/Dragon_Vault/assets/logo.png" />
</head>

<header class="header">
    <div class="logo-container">
      <img src="/Dragon_Vault/assets/logo.png" alt="DragonVault Logo" 
        class="logo" />
      <div class="brand-name">DragonVault</div>
    </div>
  </header>

<body>
  <div class="confirm-container">
    <h2>Confirm Deposit</h2>
    <p><strong>Account Number:</strong> <span id="acc_num"></span></p>
    <p><strong>Customer Name:</strong> <span id="cust_name"></span></p>
    <p><strong>Account Type:</strong> <span id="acc_type"></span></p>
    <p><strong>Current Balance:</strong> ₱<span id="bal"></span></p>
    <p><strong>Deposit Amount:</strong> ₱<span id="deposit_amt"></span></p>

    <div class="button-container">
      <button id="confirm_btn">Confirm</button>
      <button id="cancel_btn">Cancel</button>
    </div>
  </div>

  <script src="../js/teller_deposit_confirm.js"></script>
</body>
</html>
